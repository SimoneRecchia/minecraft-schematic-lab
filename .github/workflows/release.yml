# Publishes the GitHub release of a version (v0.3.0, …) with the Claude Desktop extension and the
# building skill attached, built and smoke-tested by `pnpm mcpb`. The plugin itself needs no
# release: Claude Code and Anthropic's directory read it from the repository.
#
# Release: bump `version` (package.json, packages/shared/src/version.ts), `pnpm bundle`, add the
# CHANGELOG.md section, merge into main, then either push the tag `v<version>` or run this workflow
# on main (Actions → Release → Run workflow), which creates that tag on the commit it builds.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # the version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Version and tag
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Build and smoke-test the extension
        run: pnpm mcpb

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 == "## " v { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::No '## $VERSION' in CHANGELOG.md"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target only matters when the tag doesn't exist yet (a manual run): it is created on
          # the commit this run built.
          gh release create "$TAG" \
            dist/vibeschem.mcpb dist/minecraft-builder-skill.zip \
            --title "VibeSchem $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"
